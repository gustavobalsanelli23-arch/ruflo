    <!-- Decide, antes da primeira pintura, se há animação e abertura. Se o JS
         principal não chegar em 4s, o conteúdo aparece sem animação. -->
    <script>
      (function () {
        var d = document.documentElement;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        d.classList.add('js-motion');
        try {
          if (!sessionStorage.getItem('geri:intro')) d.classList.add('js-intro');
        } catch (e) {
          d.classList.add('js-intro');
        }
        setTimeout(function () {
          if (!window.__geriReady) d.classList.remove('js-motion', 'js-intro');
        }, 4000);
      })();
    </script>
