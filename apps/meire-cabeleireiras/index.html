    <!-- Decide, antes da primeira pintura, se há animação de abertura (só no
         desktop: no celular o texto aparece já no primeiro quadro). Se o JS
         principal não chegar em 4s, o conteúdo aparece sem animação. -->
    <script>
      (function () {
        var d = document.documentElement;
        if (!window.matchMedia('(prefers-reduced-motion: no-preference) and (min-width: 1024px)').matches) return;
        d.classList.add('js-motion');
        setTimeout(function () {
          if (!window.__meireReady) d.classList.remove('js-motion');
        }, 4000);
      })();
    </script>
