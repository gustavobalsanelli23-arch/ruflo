# Configuração do Supabase CLI para desenvolvimento local (`supabase start`).
# No projeto hospedado, replique as opções de [auth] no painel: veja
# docs/supabase-configuracao.md. Este arquivo não contém segredos.

project_id = "solus"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3200/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirme seu e-mail na SOLUS"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Crie uma nova senha na SOLUS"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme o novo e-mail na SOLUS"
content_path = "./supabase/templates/email-change.html"
