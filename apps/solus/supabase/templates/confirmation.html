<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f5f7f8;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#17212b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e7ebef;border-radius:12px">
            <tr>
              <td style="background:#101923;border-radius:12px 12px 0 0;padding:20px 28px;color:#f2f5f8;font-size:13px;font-weight:600;letter-spacing:0.22em">SOLUS</td>
            </tr>
            <tr>
              <td style="padding:28px">
                <h1 style="margin:0 0 12px;font-size:20px;line-height:28px">Confirme seu e-mail</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#56626e">Para ativar sua conta na SOLUS, confirme que este endereço é seu.</p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#17212b;color:#f7f9fa;text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:8px">Confirmar e-mail</a>
                <p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#606c78">O link vale por 24 horas e funciona uma vez. Se você não criou uma conta, ignore esta mensagem.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
