<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Arte de compartilhamento (1200×630), renderizada por scripts/brand-assets.mjs -->
    <style>
      @font-face { font-family: 'Archivo'; font-weight: 300 800; font-stretch: 62% 112%; src: url('../src/fonts/archivo-latin-wdth-wght.woff2') format('woff2-variations'); }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('../src/fonts/instrument-serif-latin-400-italic.woff2') format('woff2'); }
      * { margin: 0; box-sizing: border-box; }
      body { width: 1200px; height: 630px; overflow: hidden; background: #1B0F08; color: #EFE3C9; font-family: 'Archivo', sans-serif; position: relative; }
      .label { font-stretch: 112%; font-weight: 500; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: #AD9478; display: flex; align-items: center; gap: 14px; }
      .label i { display: block; width: 11px; height: 11px; background: #C9A46C; clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
      .label s { display: block; width: 40px; height: 1px; background: #C9A46C; opacity: .7; } .label b { color: #C9A46C; font-weight: 500; }
      .text { position: absolute; left: 72px; bottom: 64px; }
      h1 { font-stretch: 62%; font-weight: 800; font-size: 236px; line-height: 0.8; text-transform: uppercase; letter-spacing: -0.01em; margin-top: 30px; }
      h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; text-transform: none; font-size: 0.6em; letter-spacing: -0.02em; }
      p.phrase { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 44px; margin-top: 26px; }
      .photo { position: absolute; right: 72px; top: 64px; bottom: 64px; width: 360px; overflow: hidden; display: none; }
      .photo.on { display: block; }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
      .scale { position: absolute; right: 72px; bottom: 78px; display: flex; gap: 7px; align-items: flex-end; height: 14px; }
      .photo.on ~ .scale { display: none; }
      .scale span { width: 1px; background: #C9A46C; opacity: .45; height: 33%; }
      .scale span:nth-child(6n+1) { height: 66%; }
      .scale span:nth-child(12n+1) { height: 100%; opacity: .9; }
    </style>
  </head>
  <body>
    <div class="photo" id="photo"></div>
    <div class="scale" id="scale"></div>
    <div class="text">
      <div class="label"><i></i>Barbearia Brandt<s></s><b>Barba e cabelo</b></div>
      <h1>Fer <em>barber</em><br />Brandt</h1>
      <p class="phrase">Só chegar e cortar.</p>
    </div>
    <script>
      document.getElementById('scale').innerHTML = '<span></span>'.repeat(37);
      // A foto do hero entra quando existir (brand-assets passa ?hero=<arquivo>).
      const hero = new URLSearchParams(location.search).get('hero');
      if (hero) {
        const photo = document.getElementById('photo');
        photo.classList.add('on');
        photo.innerHTML = `<img src="../public/images/${hero}" alt="">`;
      }
    </script>
  </body>
</html>
