    <!-- Antes da primeira pintura: decide se há abertura animada. Sem JS, ou
         com prefers-reduced-motion, nada é escondido. Se o script da abertura
         não chegar em 4s (ou algo travar até 7s), tudo aparece sem animação. -->
    <script>
      (function () {
        var d = document.documentElement;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        d.classList.add('js-intro');
        setTimeout(function () {
          if (!window.__fbbIntro) d.classList.remove('js-intro');
        }, 4000);
        setTimeout(function () {
          d.classList.remove('js-intro');
        }, 7000);
      })();
    </script>
