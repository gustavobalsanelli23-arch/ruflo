<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Arte de compartilhamento (1200×630), renderizada por scripts/brand-assets.mjs -->
    <style>
      @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 400; src: url('../node_modules/@fontsource/barlow/files/barlow-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 600; src: url('../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2') format('woff2'); }
      * { margin: 0; box-sizing: border-box; }
      body { width: 1200px; height: 630px; overflow: hidden; background: #050505; color: #F4F1EB; font-family: 'Barlow', sans-serif; position: relative; }
      .bg { position: absolute; inset: 0; background-size: cover; background-position: 50% 50%; }
      .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,5,5,.9) 0%, rgba(5,5,5,.55) 55%, rgba(5,5,5,.25) 100%), linear-gradient(180deg, rgba(5,5,5,.2) 0%, rgba(5,5,5,.75) 100%); }
      .logo { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 18px; }
      .logo b { font-weight: 600; font-size: 30px; letter-spacing: .34em; }
      .logo i { width: 1px; height: 38px; background: #B8A17A; }
      .logo span { font-size: 15px; line-height: 1.25; letter-spacing: .06em; color: #A5A5A5; }
      h1 { position: absolute; left: 72px; bottom: 76px; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 88px; line-height: .95; letter-spacing: -.025em; }
      h1 span { display: block; }
      h1 span:last-child { padding-left: 1.3em; }
      .cota { position: absolute; right: 72px; top: 82px; display: flex; align-items: center; gap: 14px; font-size: 15px; letter-spacing: .24em; text-transform: uppercase; color: rgba(244,241,235,.85); }
      .cota s { position: relative; display: block; width: 56px; height: 1px; background: #B8A17A; }
      .cota s::before, .cota s::after { content: ''; position: absolute; top: -5px; width: 1px; height: 11px; background: #B8A17A; }
      .cota s::before { left: 0; } .cota s::after { right: 0; }
    </style>
  </head>
  <body>
    <div class="bg" id="bg"></div>
    <div class="veil"></div>
    <div class="logo"><b>VOP</b><i></i><span>Investimentos<br />Imobiliários</span></div>
    <div class="cota"><s></s>Inteligência imobiliária</div>
    <h1><span>Mais do que encontrar imóveis.</span><span>Construir patrimônio.</span></h1>
    <script>
      // O pôster do hero entra quando existir (brand-assets passa ?bg=<arquivo>).
      const bg = new URLSearchParams(location.search).get('bg');
      if (bg) document.getElementById('bg').style.backgroundImage = `url('../public/images/${bg}')`;
    </script>
  </body>
</html>
