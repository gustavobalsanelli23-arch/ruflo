<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Arte de compartilhamento (1200×630), renderizada por scripts/brand-assets.mjs,
         na estética do site: moldura de fio com chanfros, Inter 700 caixa-alta e
         rótulos em Chakra Petch. -->
    <style>
      @font-face { font-family: 'Inter'; font-weight: 400; src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 700; src: url('../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Chakra Petch'; font-weight: 700; src: url('../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-700-normal.woff2') format('woff2'); }
      * { margin: 0; box-sizing: border-box; }
      body { width: 1200px; height: 630px; overflow: hidden; background: #04070d; color: #fff; font-family: 'Inter', sans-serif; position: relative; }
      .bg { position: absolute; inset: 0; background-size: cover; background-position: 50% 50%; }
      .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,7,13,.9) 0%, rgba(4,7,13,.55) 58%, rgba(4,7,13,.3) 100%), linear-gradient(180deg, rgba(4,7,13,.25) 0%, rgba(4,7,13,.8) 100%); }
      /* moldura: 30px de recuo, fio a 13%, chanfro de 26px */
      .frame { position: absolute; inset: 30px; }
      .frame b { position: absolute; background: rgba(255,255,255,.18); }
      .t { left: 26px; right: 26px; top: 0; height: 1px; } .bo { left: 26px; right: 26px; bottom: 0; height: 1px; }
      .l { top: 26px; bottom: 26px; left: 0; width: 1px; } .r { top: 26px; bottom: 26px; right: 0; width: 1px; }
      .c { position: absolute; width: 26px; height: 26px; }
      .tl, .br { background: linear-gradient(to bottom right, transparent calc(50% - .7px), rgba(255,255,255,.18) calc(50% - .7px), rgba(255,255,255,.18) calc(50% + .7px), transparent calc(50% + .7px)); }
      .tr, .bl { background: linear-gradient(to bottom left, transparent calc(50% - .7px), rgba(255,255,255,.18) calc(50% - .7px), rgba(255,255,255,.18) calc(50% + .7px), transparent calc(50% + .7px)); }
      .tl { left: 0; top: 0; } .tr { right: 0; top: 0; } .br { right: 0; bottom: 0; } .bl { left: 0; bottom: 0; }
      .logo { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 14px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; }
      .logo .sym { height: 54px; width: auto; } .logo .word { height: 21px; width: auto; }
      .logo span { font-size: 11px; line-height: 1.3; letter-spacing: .12em; text-transform: uppercase; color: rgba(232,238,250,.6); border-left: 1px solid rgba(255,255,255,.2); padding-left: 12px; }
      .tag { position: absolute; right: 72px; top: 70px; height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 20px; background: #e8d1cb; color: #15131b; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
      h1 { position: absolute; left: 72px; bottom: 120px; font-weight: 700; font-size: 48px; line-height: 1.06; letter-spacing: .045em; text-transform: uppercase; }
      h1 span { display: block; }
      p { position: absolute; left: 72px; bottom: 76px; font-size: 19px; color: rgba(224,232,245,.75); }
    </style>
  </head>
  <body>
    <div class="bg" id="bg"></div>
    <div class="veil"></div>
    <div class="frame"><b class="t"></b><b class="r"></b><b class="bo"></b><b class="l"></b><i class="c tl"></i><i class="c tr"></i><i class="c br"></i><i class="c bl"></i></div>
    <div class="logo">
      <!-- marca da VOP (mesmo vetor de src/components/VopMark.tsx) -->
      <svg class="sym" viewBox="240 194 250 282"><g fill="none" stroke="#fff" stroke-width="6.6"><path d="M245 311.5 L365 208.5 L485 313"/><path d="M269 331 V374 M317.5 287 V414.5 M364 257 V472.5 M413 198 V429 M461 331 V374.5"/></g></svg>
      <svg class="word" viewBox="248 524 234 68"><g fill="none" stroke="#fff" stroke-width="8.2"><path d="M254.5 528 L276.5 587.8 L298.5 528" stroke-linejoin="bevel"/><ellipse cx="369.5" cy="558" rx="27.5" ry="26.2"/><path d="M445 588.5 V531.6 H459.5 A14.7 14.7 0 0 1 459.5 561 H445"/></g></svg>
      <span>Investimentos<br />Imobiliários</span>
    </div>
    <div class="tag">Inteligência imobiliária</div>
    <h1><span>Mais do que encontrar imóveis.</span><span>Construir patrimônio.</span></h1>
    <p>Assessoria imobiliária, investimentos e oportunidades estratégicas.</p>
    <script>
      // O pôster entra quando existir (brand-assets passa ?bg=<arquivo>).
      const bg = new URLSearchParams(location.search).get('bg');
      if (bg) document.getElementById('bg').style.backgroundImage = `url('../public/images/${bg}')`;
    </script>
  </body>
</html>
