    <!-- Antes da primeira pintura: com JS, as entradas animadas começam
         escondidas (o Framer Motion as revela). Se o app não hidratar em 6s,
         a classe volta e tudo aparece sem animação. Sem JS, nada se esconde. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.remove('no-js');
        setTimeout(function () {
          if (!window.__vopReady) d.classList.add('no-js');
        }, 6000);
      })();
    </script>
